name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Dummy values so `next build` can evaluate env-dependent modules.
      # No real service is contacted during the build.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
      GEMINI_API_KEY: ci-dummy-gemini-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Design rules
        run: npm run design:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # End-to-end tests (Prompt 4.3) against a separate Supabase project made for
  # testing (decision D12). Skipped, not failed, until its secrets exist:
  # E2E_SUPABASE_URL, E2E_SUPABASE_ANON_KEY, E2E_SUPABASE_SERVICE_ROLE_KEY.
  e2e:
    runs-on: ubuntu-latest
    needs: verify
    env:
      E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check for the test project
        id: gate
        run: |
          if [ -n "$E2E_SUPABASE_URL" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "No E2E secrets: skipping."; fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: steps.gate.outputs.run == 'true'

      - run: npx playwright install --with-deps chromium
        if: steps.gate.outputs.run == 'true'

      - run: npm run test:e2e
        if: steps.gate.outputs.run == 'true'

      - uses: actions/upload-artifact@v4
        if: failure() && steps.gate.outputs.run == 'true'
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
